services:
  database:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus -d directus"]
      interval: 5s
      timeout: 5s
      retries: 10
    shm_size: 128mb

  directus:
    image: directus/directus:12.3.1
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET}
      PUBLIC_URL: https://cms.adechlien.blog
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_LOCATIONS: r2
      STORAGE_R2_DRIVER: s3
      STORAGE_R2_KEY: ${R2_ACCESS_KEY_ID}
      STORAGE_R2_SECRET: ${R2_SECRET_ACCESS_KEY}
      STORAGE_R2_BUCKET: adechlien-directus-media
      STORAGE_R2_REGION: auto
      STORAGE_R2_ENDPOINT: ${R2_ENDPOINT}
      STORAGE_R2_FORCE_PATH_STYLE: "true"
      CACHE_ENABLED: "true"
      CACHE_STORE: memory
      CACHE_AUTO_PURGE: "true"
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_STORE: memory
      ASSETS_CACHE_TTL: 30d
    networks:
      - frontend
      - backend
    volumes:
      - ../extensions:/directus/extensions:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8055/server/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - frontend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  frontend:
  backend:
    internal: true

volumes:
  database_data:
  caddy_data:
  caddy_config:
